name: Fork release

on:
  workflow_dispatch:
  push:
    tags:
      - v*-it.*
  workflow_call:
    inputs:
      ref:
        description: Branch to build, fast-forwarded into main when the build succeeds
        type: string
        required: true

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          base=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [[ "$GITHUB_REF_TYPE" == tag && -z "${{ inputs.ref }}" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != "v$base-it."* ]]; then
              echo "::error::Tag $tag does not match version $base"
              exit 1
            fi
            build="${tag##*-it.}"
          else
            last=$(git tag --list "v$base-it.*" | sed 's/.*-it\.//' | sort -n | tail -1)
            build=$(( ${last:-0} + 1 ))
            tag="v$base-it.$build"
          fi
          skip=false
          if gh release view "$tag" > /dev/null 2>&1; then
            skip=true
          fi
          {
            echo "base=$base"
            echo "build=$build"
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.version.outputs.skip != 'true'
        uses: ./.github/actions/fork-build
        with:
          build-number: ${{ steps.version.outputs.build }}
          signing-key: ${{ secrets.SIGNING_KEY }}
          store-password: ${{ secrets.KEY_STORE_PASSWORD }}
          key-alias: ${{ secrets.ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}

      - name: Promote to main
        if: steps.version.outputs.skip != 'true' && inputs.ref != ''
        run: |
          git push origin "HEAD:refs/heads/main"
          git push origin --delete "${{ inputs.ref }}"

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BASE: ${{ steps.version.outputs.base }}
        run: |
          set -euo pipefail
          prev=$(git tag --list 'v*-it.*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          {
            echo "Based on Mihon [v$BASE](https://github.com/mihonapp/mihon/releases/tag/v$BASE)."
            echo
            if [[ -n "$prev" ]]; then
              git log --first-parent --format='- %s' "$prev..HEAD"
            fi
          } > notes.md

          out=app/build/outputs/apk/release
          mv "$out/app-universal-release.apk" "mihon-it-$VERSION.apk"
          mv "$out/app-arm64-v8a-release.apk" "mihon-it-arm64-v8a-$VERSION.apk"

          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "Mihon IT $VERSION" \
            --notes-file notes.md \
            "mihon-it-$VERSION.apk" \
            "mihon-it-arm64-v8a-$VERSION.apk"
